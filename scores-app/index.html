<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scores</title>
<meta name="description" content="Real-time college football, NFL, and college hockey scoreboard.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8572a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <span class="brand-name">Live Scores</span>
  </div>

  <nav class="league-tabs" role="tablist" aria-label="League">
    <button class="tab" role="tab" data-league="cfb">College Football</button>
    <button class="tab" role="tab" data-league="nfl">NFL</button>
    <button class="tab" role="tab" data-league="nhl">NHL</button>
  </nav>

  <div class="topbar-right">
    <div class="refresh-indicator" id="refreshIndicator" title="Auto refresh">
      <svg viewBox="0 0 36 36" class="ring" aria-hidden="true">
        <circle class="ring-bg" cx="18" cy="18" r="15.5"/>
        <circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.5"/>
      </svg>
      <button class="icon-btn" id="refreshBtn" title="Refresh now (R)" aria-label="Refresh now">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="notifyBtn" title="Alerts for favorite teams" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </button>
    <button class="icon-btn" id="densityBtn" title="Toggle compact layout" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<section class="live-strip" id="liveStrip" hidden aria-label="Live now across all leagues"></section>

<section class="toolbar">
  <div class="toolbar-row">
    <div class="view-tabs" role="tablist" aria-label="View">
      <button class="vtab" role="tab" data-view="scores">Scores</button>
      <button class="vtab" role="tab" data-view="standings">Standings</button>
      <button class="vtab" role="tab" data-view="rankings" id="rankingsTab">Rankings</button>
    </div>
    <div class="nav-group" id="navGroup">
      <button class="pill" id="prevBtn" title="Previous ([)">&#8249;</button>
      <select class="pill select" id="periodSelect" aria-label="Week or date"></select>
      <button class="pill" id="nextBtn" title="Next (])">&#8250;</button>
      <button class="pill" id="todayBtn">Now</button>
      <button class="pill toggle" id="weekendBtn" hidden aria-pressed="false">Weekend</button>
    </div>

    <div class="filter-group">
      <select class="pill select" id="divisionSelect" aria-label="Division" hidden></select>
      <select class="pill select" id="confSelect" aria-label="Conference"></select>
      <select class="pill select" id="pollSelect" aria-label="Poll" hidden></select>
      <button class="pill toggle" id="top25Btn" aria-pressed="false">Top 25</button>
      <button class="pill toggle" id="favOnlyBtn" aria-pressed="false" title="Only games with a starred team">&#9733; Only</button>
      <select class="pill select" id="sortSelect" aria-label="Sort">
        <option value="status">Live first</option>
        <option value="time">By kickoff</option>
        <option value="close">Closest games</option>
      </select>
    </div>

    <div class="search-group">
      <input type="search" id="searchInput" class="pill search" placeholder="Find a team  ( / )" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div class="status-line">
    <span id="statusText">Loading…</span>
    <span id="updatedText" class="muted"></span>
  </div>
</section>

<main class="board" id="board" aria-live="polite"></main>
<section class="panel" id="panel" hidden></section>

<aside class="drawer" id="drawer" hidden aria-label="Game details">
  <div class="drawer-inner">
    <button class="icon-btn drawer-close" id="drawerClose" aria-label="Close">&#10005;</button>
    <div id="drawerBody"></div>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="toast" id="toast" hidden></div>

<footer class="foot">
  <span>Data: ESPN public endpoints · unofficial · refreshes every <span id="intervalText">60</span>s</span>
  <span class="muted">Keys: 1/2/3 league · S scores · T standings · P polls · [ ] prev/next · R refresh · / search · Esc close</span>
</footer>

<script src="app.js"></script>
</body>
</html>
